name: Live eval

on:
  push:
    branches: [claude/live-eval]
    paths: [".github/workflows/live-eval.yml", "scripts/live-eval.ts", "evals/live/**"]

permissions:
  contents: write

concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  probe:
    name: Check which model secrets exist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record secret presence (names only, never values)
        env:
          S_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          S_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          V_LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          V_LLM_MODEL: ${{ vars.LLM_MODEL }}
          S_LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          S_LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          mkdir -p reports/live
          p(){ if [ -n "$1" ]; then echo true; else echo false; fi; }
          cat > reports/live/secret-probe.json <<JSON
          {"checkedAt":"$(date -u +%FT%TZ)","LLM_API_KEY":$(p "$S_LLM_API_KEY"),"OPENAI_API_KEY":$(p "$S_OPENAI_API_KEY"),"ANTHROPIC_API_KEY":$(p "$S_ANTHROPIC_API_KEY"),"OPENROUTER_API_KEY":$(p "$S_OPENROUTER_API_KEY"),"LLM_PROVIDER_var":"${V_LLM_PROVIDER}","LLM_MODEL_var":"${V_LLM_MODEL}","LLM_PROVIDER_secret":$(p "$S_LLM_PROVIDER"),"LLM_MODEL_secret":$(p "$S_LLM_MODEL")}
          JSON
          cat reports/live/secret-probe.json
      - name: Commit probe result
        run: |
          git config user.name "openreview-live-eval"
          git config user.email "actions@users.noreply.github.com"
          git add reports/live/secret-probe.json
          git commit -m "Live eval: secret probe [skip ci]" && git push origin HEAD:claude/live-eval
