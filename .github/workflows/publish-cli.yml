# Manual publish of packages/cli as openreview-cli. Not run on push: the package is not on npm yet
# (see docs/AUDIT.md). Needs repository secret NPM_TOKEN with publish rights, then a human
# workflow_dispatch after bumping packages/cli/package.json version.
name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish openreview-cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      - name: Publish
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag ${{ inputs.tag }}
