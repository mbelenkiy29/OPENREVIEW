name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates convex/_generated against a throwaway local backend (no Convex account or secrets).
      # CONVEX_AGENT_MODE=anonymous is required: `convex codegen` alone refuses without CONVEX_DEPLOYMENT.
      - name: Check Convex generated files
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          pnpm exec convex dev --once --typecheck disable
          git diff --exit-code convex/_generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # APP_URL is not set for tests: GitHub summaries omit dashboard links unless it is present.
      - run: pnpm build
        env:
          APP_URL: http://localhost:3000
      - name: Smoke marketing routes
        run: pnpm exec tsx scripts/marketing-smoke.ts
