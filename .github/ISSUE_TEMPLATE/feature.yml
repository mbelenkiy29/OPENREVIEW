name: Feature request
description: A new capability or a change to documented behaviour.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Keep the change scoped; reuse the shared review engine for new SCM or API adapters.

        Usage questions belong in [Discussions Q&A](https://github.com/mbelenkiy29/OPENREVIEW/discussions/categories/q-a). Security reports go to [SECURITY.md](https://github.com/mbelenkiy29/OPENREVIEW/blob/main/SECURITY.md), not here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would unblock them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: tests
    attributes:
      label: Follow-up
      options:
        - label: I can help with tests or docs for this change
          required: false
