name: Feature
description: A new capability or a change to documented behaviour.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Keep the change scoped; reuse the shared review engine for new SCM or API adapters.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would unblock them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: tests
    attributes:
      label: Follow-up
      options:
        - label: I can help with tests or docs for this change
          required: false
